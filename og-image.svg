<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.5" stop-color="#0d1520"/>
      <stop offset="1" stop-color="#1a0a18"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <!-- robot head -->
  <g transform="translate(820,180)">
    <rect x="30" y="60" width="240" height="180" rx="40" fill="#00f0ff"/>
    <rect x="60" y="95" width="180" height="85" rx="24" fill="#0a0a0f"/>
    <circle cx="110" cy="137" r="24" fill="#ff2d95"/>
    <circle cx="190" cy="137" r="24" fill="#ff2d95"/>
    <rect x="95" y="205" width="110" height="20" rx="10" fill="#0a0a0f"/>
    <rect x="140" y="20" width="28" height="50" rx="14" fill="#ffe600"/>
    <circle cx="154" cy="16" r="22" fill="#ffe600"/>
  </g>
  <!-- wordmark -->
  <text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="bold" fill="url(#txt)">ROBO.DANCE</text>
  <text x="84" y="370" font-family="monospace" font-size="34" fill="#ffe600">beep boop. generate chaos.</text>
  <text x="84" y="470" font-family="monospace" font-size="26" fill="#a8a0b8">billyx86.github.io/robo-dance</text>
</svg>
