<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — ROBO.DANCE</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="/robo-dance/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0f;--surface:#14141f;--text:#fff8f0;--muted:#a8a0b8;--hot:#ff2d95;--cyan:#00f0ff;--acid:#ffe600;--border:#2a2a3d;--shadow:6px 6px 0 #000}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(255,45,149,.18),transparent 50%),radial-gradient(ellipse 60% 40% at 90% 20%,rgba(0,240,255,.14),transparent 45%);pointer-events:none}
.card{position:relative;text-align:center;max-width:420px}
.big{font-size:clamp(4rem,18vw,7rem);line-height:1;letter-spacing:-.03em}
.big em{color:var(--hot);font-style:normal;text-shadow:3px 3px 0 var(--cyan)}
.msg{font-family:"Space Mono",monospace;color:var(--muted);margin:1rem 0 1.75rem;font-size:.9rem}
.btn{font-family:Fredoka,sans-serif;font-weight:600;font-size:1rem;border:3px solid #000;border-radius:14px;padding:.75rem 1.25rem;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;color:#fff;background:var(--hot)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
</style>
</head>
<body>
<div class="card">
  <div class="big"><em>404</em></div>
  <p class="msg">error 404: page not found.<br/>the robot danced past this URL.</p>
  <a class="btn" href="/robo-dance/">🤖 back to the dance floor</a>
</div>
</body>
</html>
